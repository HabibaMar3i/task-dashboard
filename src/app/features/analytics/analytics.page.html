<h1 class="mb-4 text-2xl text-accent font-bold">Analytics</h1>

<div class="grid gap-6 md:grid-cols-2">
  <section class="rounded-lg border border-accent shadow-md bg-white p-4">
    <h2 class="mb-2 font-semibold">Tasks by status</h2>
    <p-chart type="doughnut" [data]="statusChart()" [options]="chartOptions" />
  </section>

  <section class="rounded-lg border border-accent shadow-md bg-white p-4">
    <h2 class="mb-2 font-semibold">Tasks by priority</h2>
    <p-chart type="doughnut" [data]="priorityChart()" [options]="chartOptions" />
  </section>
</div>
