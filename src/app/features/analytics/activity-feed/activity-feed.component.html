<ul class="flex flex-col gap-3">
  @for (activity of activities(); track activity.id) {
    <li class="flex items-start justify-between gap-4 border-b border-b-text-muted pb-2 text-sm">
      <span>
        <strong>{{ activity.userName }}</strong> {{ activity.type }} "{{ activity.taskTitle }}"
      </span>
      <time class="text-gray-500" [attr.datetime]="activity.timestamp">
        {{ activity.timestamp | date: 'short' }}
      </time>
    </li>
  } @empty {
    <li class="text-gray-500">No recent activity.</li>
  }
</ul>
