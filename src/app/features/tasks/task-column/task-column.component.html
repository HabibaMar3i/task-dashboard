<section class="rounded-lg border-b-2 border-solid border-border bg-white p-4">
  <h2 class="mb-2 flex items-center justify-between font-bold">
    <span class="uppercase tracking-wide text-sm">{{ heading() }} </span>
    <span class="rounded-xl bg-surface-muted px-2 py-px text-sm text-text-primary">
      {{ tasks().length }}
    </span>
  </h2>
  <div
    class="flex min-h-24 flex-col gap-4"
    cdkDropList
    [cdkDropListData]="tasks()"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (task of tasks(); track task.id) {
      <app-task-card
        cdkDrag
        [cdkDragData]="task"
        [task]="task"
        (edit)="edit.emit($event)"
        (deleteTask)="deleteTask.emit($event)"
      />
    }
  </div>
</section>
