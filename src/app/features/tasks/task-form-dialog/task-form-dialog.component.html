<p-dialog header="New Task" [(visible)]="visible" [modal]="true" [style]="{ width: '28rem' }">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">
    <label class="flex flex-col gap-1">
      Title
      <input formControlName="title" class="rounded border p-2" />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <small class="text-red-600">Title is required (at least 3 characters)</small>
      }
    </label>

    <label class="flex flex-col gap-1">
      Description
      <textarea formControlName="description" class="rounded border p-2"></textarea>
    </label>

    <label class="flex flex-col gap-1">
      Priority
      <select formControlName="priority" class="rounded border p-2">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </label>

    <label class="flex flex-col gap-1">
      Status
      <select formControlName="status" class="rounded border p-2">
        <option value="todo">To Do</option>
        <option value="in_progress">In Progress</option>
        <option value="done">Done</option>
      </select>
    </label>

    <label class="flex flex-col gap-1">
      Due date
      <input type="date" formControlName="dueDate" class="rounded border p-2" />
      @if (form.controls.dueDate.touched && form.controls.dueDate.invalid) {
        <small class="text-red-600">Due date is required</small>
      }
    </label>

    <button type="submit" class="rounded bg-blue-600 p-2 text-white">Save</button>
  </form>
</p-dialog>
