<p-dialog header="New Task" [(visible)]="visible" [modal]="true" [style]="{ width: '28rem' }">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">
    <label class="flex flex-col gap-1">
      Title
      <input formControlName="title" class="rounded border p-2" />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <small class="text-red-600">Title is required (at least 3 characters)</small>
      }
    </label>

    <label class="flex flex-col gap-1">
      Description
      <textarea formControlName="description" class="rounded border p-2"></textarea>
    </label>

    <label class="flex flex-col gap-1">
      Priority
      <select formControlName="priority" class="rounded border p-2">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </label>

    <label class="flex flex-col gap-1">
      Status
      <select formControlName="status" class="rounded border p-2">
        <option value="todo">To Do</option>
        <option value="in_progress">In Progress</option>
        <option value="done">Done</option>
      </select>
    </label>

    <label class="flex flex-col gap-1">
      Due date
      <input type="date" formControlName="dueDate" class="rounded border p-2" />
      @if (form.controls.dueDate.touched && form.controls.dueDate.invalid) {
        <small class="text-red-600">Due date is required</small>
      }
      @if (form.controls.dueDate.errors?.['pastDate']) {
        <small class="text-red-600">Due date can't be in the past</small>
      }
    </label>

    <label class="flex flex-col gap-1">
      Assignee
      <select formControlName="assigneeId" class="rounded border p-2">
        <option value="">Select...</option>
        @for (user of users(); track user.id) {
          <option [value]="user.id">{{ user.name }}</option>
        }
      </select>
      @if (form.controls.assigneeId.touched && form.controls.assigneeId.invalid) {
        <small class="text-red-600">Choose an assignee</small>
      }
    </label>

    <div formArrayName="tags" class="flex flex-col gap-2">
      @for (tag of tags.controls; track $index) {
        <div class="flex gap-2">
          <input [formControlName]="$index" class="flex-1 rounded border p-2" />
          <button type="button" (click)="removeTag($index)">Remove</button>
        </div>
      }
      <button type="button" (click)="addTag()">+ Add tag</button>
    </div>

    <button type="submit" class="rounded bg-blue-600 p-2 text-white">Save</button>
  </form>
</p-dialog>
