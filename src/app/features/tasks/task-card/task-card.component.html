<div
  class="rounded-lg border border-border bg-white p-4"
  [class.border-l-4]="isOverdue()"
  [class.border-l-danger]="isOverdue()"
  [class.bg-danger-subtle]="isOverdue()"
>
  <div class="mb-2 flex items-center justify-between">
    <span class="rounded px-2 py-1 text-[10px] font-bold uppercase" [class]="priorityClass()">
      {{ task().priority }}
    </span>
    <button
      type="button"
      aria-label="Edit task"
      class="cursor-pointer border-0 bg-transparent text-lg leading-none text-text-muted"
      (click)="edit.emit(task())"
    >
      ⋮
    </button>
  </div>

  <h3 class="mb-1 text-sm font-bold text-text-primary">{{ task().title }}</h3>
  <p class="mb-2 text-xs text-text-muted">{{ task().description }}</p>

  <div class="space-y-0.5 text-xs text-text-muted">
    @if (isOverdue()) {
      <p>⚠ {{ overdueMessage() }}</p>
    } @else {
      <p>Due: {{ task().dueDate }}</p>
    }
    @if (task().tags.length) {
      <p>{{ task().tags[0] }}</p>
    }
  </div>

  <div class="mt-4 flex items-center gap-1 border-t border-border pt-3">
    <span
      class="flex size-6 items-center justify-center rounded-full bg-accent text-[10px] font-bold text-white"
    >
      {{ task().assignee.avatar }}
    </span>
    <span class="text-xs text-text-primary">@{{ task().assignee.name }}</span>
  </div>
</div>
