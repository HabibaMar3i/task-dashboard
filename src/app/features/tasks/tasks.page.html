@if (store.loading()) {
  <p>Loading...</p>
}

@if (store.error()) {
  <p>{{ store.error() }}</p>
}

<div class="mb-4 flex items-center justify-between rounded-lg bg-white p-3 shadow-sm">
  <div class="flex gap-2">
    @for (tab of statusTabs; track tab.label) {
      <button
        type="button"
        class="rounded px-4 py-1.5 text-sm"
        [class.bg-accent]="store.filters().status === tab.value"
        [class.text-white]="store.filters().status === tab.value"
        [class.text-text-primary]="store.filters().status !== tab.value"
        (click)="store.setStatus(tab.value)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <div class="flex items-center gap-3">
    <select
      class="rounded border border-border bg-white px-3 py-1.5 text-sm"
      [value]="store.filters().priority ?? ''"
      (change)="onPriorityChange($any($event.target).value)"
    >
      <option value="">Priority</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>

    <button
      type="button"
      class="rounded bg-accent px-4 py-1.5 text-sm font-bold text-white cursor-pointer"
      (click)="openCreate()"
    >
      + New Task
    </button>
    <app-task-form-dialog
      [users]="store.users()"
      [(visible)]="showForm"
      (save)="onSave($event)"
      [task]="editingTask()"
    />
  </div>
</div>

<div class="grid grid-cols-1 gap-4 md:grid-cols-3" cdkDropListGroup>
  <app-task-column
    heading="To Do"
    [tasks]="store.todoTasks()"
    (edit)="openEdit($event)"
    (deleteTask)="confirmDelete($event)"
    status="todo"
    (moved)="onMoved($event)"
  />
  <app-task-column
    heading="In Progress"
    [tasks]="store.inProgressTasks()"
    (edit)="openEdit($event)"
    (deleteTask)="confirmDelete($event)"
    status="in_progress"
    (moved)="onMoved($event)"
  />
  <app-task-column
    heading="Done"
    [tasks]="store.doneTasks()"
    (edit)="openEdit($event)"
    (deleteTask)="confirmDelete($event)"
    status="done"
    (moved)="onMoved($event)"
  />
</div>

<p-confirmdialog />
