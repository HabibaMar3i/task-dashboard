<aside
  class="flex w-full flex-col justify-between border-b border-border bg-white p-4 md:w-60 md:border-b-0 md:border-r"
>
  <nav class="grid grid-cols-3 gap-2 md:flex md:flex-col md:gap-4" aria-label="Main navigation">
    @for (link of links; track link.label) {
      @if (link.link) {
        <a
          [routerLink]="link.link"
          routerLinkActive="bg-accent text-white"
          [routerLinkActiveOptions]="{ exact: link.link === '/' }"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-4 rounded px-3 py-2 text-sm text-text-primary"
        >
          <span aria-hidden="true">{{ link.icon }}</span>
          {{ link.label }}
        </a>
      } @else {
        <span
          aria-disabled="true"
          class="flex items-center gap-4 rounded px-3 py-2 text-sm text-text-muted"
        >
          <span aria-hidden="true">{{ link.icon }}</span>
          {{ link.label }}
        </span>
      }
    }
  </nav>

  <button
    type="button"
    class="w-full rounded bg-accent px-4 py-2 text-sm font-semibold text-white mt-4"
  >
    + New Task
  </button>
</aside>
